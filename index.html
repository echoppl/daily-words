<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- build: 2026-07-08-v6 (calendar) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 5 个英语单词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
    padding: 24px 16px;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 1.6rem;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .header .date {
    font-size: 0.85rem;
    color: #8892a6;
  }
  .controls {
    text-align: center;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .play-all-btn { background: #10b981; color: #fff; }
  .play-all-btn:hover { background: #059669; transform: translateY(-1px); }
  .toggle-history-btn { background: #8b5cf6; color: #fff; }
  .toggle-history-btn:hover { background: #7c3aed; transform: translateY(-1px); }
  .calendar-btn { background: #f59e0b; color: #fff; text-decoration: none; }
  .calendar-btn:hover { background: #d97706; transform: translateY(-1px); }

  .cards {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-left: 5px solid #4a6cf7;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .word-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .word {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1a2e;
  }
  .phonetic {
    font-size: 0.95rem;
    color: #6b7280;
    font-style: italic;
  }
  .speak-btn {
    background: #4a6cf7;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .speak-btn:hover { background: #3451d6; transform: scale(1.1); }
  .speak-btn:active { transform: scale(0.95); }
  .speak-btn.playing {
    background: #f59e0b;
    animation: pulse 0.8s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .pos {
    font-size: 0.8rem;
    color: #8892a6;
    margin-bottom: 10px;
  }
  .meaning {
    font-size: 1rem;
    color: #374151;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .example {
    background: #f0f4ff;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .example .en { font-size: 0.95rem; color: #1a1a2e; margin-bottom: 4px; }
  .example .cn { font-size: 0.88rem; color: #6b7280; }
  .example .speak-sm {
    background: none;
    border: 1px solid #4a6cf7;
    color: #4a6cf7;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
    transition: all 0.2s;
  }
  .example .speak-sm:hover { background: #4a6cf7; color: #fff; }
  .tip {
    font-size: 0.88rem;
    color: #7c3aed;
    background: #faf5ff;
    border-radius: 8px;
    padding: 10px 14px;
    line-height: 1.6;
  }
  .tip strong { color: #6d28d9; }

  /* ---- History Section ---- */
  .history-section {
    max-width: 720px;
    margin: 32px auto 0;
    display: none;
  }
  .history-section.open { display: block; }
  .history-header {
    text-align: center;
    margin-bottom: 16px;
  }
  .history-header h2 {
    font-size: 1.2rem;
    color: #5b21b6;
  }
  .history-header .sub {
    font-size: 0.8rem;
    color: #a78bfa;
    margin-top: 4px;
  }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-day {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    overflow: hidden;
  }
  .history-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 18px;
    cursor: pointer;
    background: #faf5ff;
    border-bottom: 1px solid #ede9fe;
    user-select: none;
    transition: background 0.15s;
  }
  .history-day-header:hover { background: #f3e8ff; }
  .history-day-header .day-label {
    font-weight: 600;
    font-size: 0.95rem;
    color: #5b21b6;
  }
  .history-day-header .day-date {
    font-size: 0.78rem;
    color: #a78bfa;
  }
  .history-day-header .arrow {
    font-size: 0.85rem;
    color: #a78bfa;
    transition: transform 0.2s;
  }
  .history-day.open .history-day-header .arrow { transform: rotate(180deg); }
  .history-day-body {
    display: none;
    padding: 12px 18px 16px;
  }
  .history-day.open .history-day-body { display: block; }
  .history-word {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f3f4f6;
    flex-wrap: wrap;
  }
  .history-word:last-child { border-bottom: none; }
  .history-word .hw-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #1a1a2e;
    min-width: 100px;
  }
  .history-word .hw-phonetic {
    font-size: 0.8rem;
    color: #9ca3af;
    font-style: italic;
  }
  .history-word .hw-pos {
    font-size: 0.75rem;
    color: #9ca3af;
    background: #f3f4f6;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .history-word .hw-meaning { font-size: 0.88rem; color: #4b5563; flex: 1; }
  .history-word .hw-tip {
    font-size: 0.78rem;
    color: #8b5cf6;
    background: #faf5ff;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .history-word .hw-speak {
    background: none;
    border: 1px solid #c4b5fd;
    color: #7c3aed;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 0.7rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .history-word .hw-speak:hover { background: #7c3aed; color: #fff; }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.82rem;
    color: #8892a6;
  }
</style>
</head>
<body>

<div class="header">
  <h1>📖 每日 5 个英语单词</h1>
  <div class="date" id="today-date"></div>
</div>

<div class="controls">
  <button class="btn play-all-btn" onclick="playAll()">🔊 依次朗读全部</button>
  <button class="btn toggle-history-btn" onclick="toggleHistory()">📋 历史记录</button>
  <a class="btn calendar-btn" id="calendar-link" target="_blank">📅 添加到日历</a>
</div>

<div class="cards" id="today-cards"></div>

<div class="history-section" id="history-section">
  <div class="history-header">
    <h2>📚 历史单词（近30天）</h2>
    <div class="sub">共 <span id="history-count">0</span> 天 · 点击日期展开</div>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<div class="footer">点击 🔊 按钮听发音 · 点"朗读"听完整例句 · 历史记录保留最近30天</div>

<!-- ====== JS ====== -->
<script>
// ====== SPEECH ======
const synth = window.speechSynthesis;
let enVoice = null;
function loadVoices() {
  const voices = synth.getVoices();
  enVoice = voices.find(v => v.lang === 'en-US' && /Google|Samantha|Daniel|Karen/i.test(v.name))
         || voices.find(v => v.lang === 'en-US')
         || voices.find(v => v.lang.startsWith('en'))
         || null;
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function speak(text) {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US'; utter.rate = 0.9; utter.pitch = 1;
  if (enVoice) utter.voice = enVoice;
  document.querySelectorAll('.speak-btn,.hw-speak').forEach(b => b.classList.remove('playing'));
  const caller = event && event.currentTarget;
  if (caller) caller.classList.add('playing');
  utter.onend = () => { if (caller) caller.classList.remove('playing'); };
  synth.speak(utter);
}

// ====== RENDER TODAY ======
const data = JSON.parse(document.getElementById('word-data').textContent);
const today = data.today;

document.getElementById('today-date').textContent =
  today.date.replace(/-/g, '年').replace(/(\d+)年(\d+)年/, '$1月$2日') + ' · ' + today.weekday;

// 生成 Google 日历链接（今晚9点提醒）
const d = today.date.replace(/-/g, '') + 'T210000';
const calUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
  '&text=' + encodeURIComponent('📖 每日英语单词') +
  '&dates=' + d + '/' + d.replace('210000','211500') +
  '&recur=RRULE:FREQ%3DDAILY' +
  '&details=' + encodeURIComponent('花3分钟复习今天的5个单词：https://echoppl.github.io/daily-words');
document.getElementById('calendar-link').href = calUrl;

const cardsEl = document.getElementById('today-cards');
const todayWords = [];

today.words.forEach((w, i) => {
  todayWords.push(w.word);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="word-row">' +
      '<button class="speak-btn" onclick="speak(\'' + w.word + '\')">🔊</button>' +
      '<span class="word">' + w.word + '</span>' +
      '<span class="phonetic">' + w.phonetic + '</span>' +
    '</div>' +
    '<div class="pos">' + w.pos + ' ' + w.meaning_short + '</div>' +
    '<div class="meaning">' + w.meaning + '</div>' +
    '<div class="example">' +
      '<div class="en">' + w.example_en + '<button class="speak-sm" onclick="speak(\'' + w.example_en.replace(/<[^>]*>/g,'').replace(/"/g,'\\"') + '\')">朗读</button></div>' +
      '<div class="cn">' + w.example_cn + '</div>' +
    '</div>' +
    '<div class="tip">💡 <strong>记忆：</strong>' + w.tip + '</div>';
  cardsEl.appendChild(card);
});

// ====== RENDER HISTORY ======
function renderHistory() {
  const listEl = document.getElementById('history-list');
  document.getElementById('history-count').textContent = data.history.length;

  data.history.forEach(day => {
    const dayEl = document.createElement('div');
    dayEl.className = 'history-day';
    let wordsHTML = '';
    day.words.forEach(w => {
      wordsHTML +=
        '<div class="history-word">' +
          '<button class="hw-speak" onclick="speak(\'' + w.word + '\')">🔊</button>' +
          '<span class="hw-word">' + w.word + '</span>' +
          '<span class="hw-phonetic">' + w.phonetic + '</span>' +
          '<span class="hw-pos">' + w.pos + '</span>' +
          '<span class="hw-meaning">' + w.meaning_short + '</span>' +
          '<span class="hw-tip">💡 ' + w.tip_short + '</span>' +
        '</div>';
    });
    dayEl.innerHTML =
      '<div class="history-day-header" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<span class="day-label">' + day.date.replace(/-/g,'/') + ' ' + day.weekday + ' · ' + day.words.length + '词</span>' +
        '<span class="arrow">▼</span>' +
      '</div>' +
      '<div class="history-day-body">' + wordsHTML + '</div>';
    listEl.appendChild(dayEl);
  });
}
renderHistory();

// ====== TOGGLE HISTORY ======
function toggleHistory() {
  const section = document.getElementById('history-section');
  const btn = document.querySelector('.toggle-history-btn');
  const todayCards = document.getElementById('today-cards');
  const controls = document.querySelector('.controls');
  const header = document.querySelector('.header');

  section.classList.toggle('open');
  const isOpen = section.classList.contains('open');

  // 打开历史时隐藏今日内容，突出历史记录
  todayCards.style.display = isOpen ? 'none' : '';
  document.querySelector('.play-all-btn').style.display = isOpen ? 'none' : '';
  btn.textContent = isOpen ? '📋 收起历史' : '📋 历史记录';

  // 滚动到历史区域
  if (isOpen) {
    setTimeout(() => section.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  } else {
    setTimeout(() => header.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }
}

// ====== PLAY ALL ======
function playAll() {
  const btns = document.querySelectorAll('#today-cards .speak-btn');
  let i = 0;
  synth.cancel();
  function next() {
    if (i >= todayWords.length) { btns.forEach(b => b.classList.remove('playing')); return; }
    const utter = new SpeechSynthesisUtterance(todayWords[i]);
    utter.lang = 'en-US'; utter.rate = 0.9;
    if (enVoice) utter.voice = enVoice;
    btns.forEach(b => b.classList.remove('playing'));
    if (btns[i]) btns[i].classList.add('playing');
    utter.onend = () => { i++; setTimeout(next, 400); };
    synth.speak(utter);
  }
  next();
}
</script>

</body>
</html>
